<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedBook — Appointment Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }
    .top-header { background: linear-gradient(135deg,#1a6b3c,#2d8653); color:#fff; padding:18px 30px; display:flex; justify-content:space-between; align-items:center; }
    .top-header h1 { font-size:1.6rem; font-weight:800; }
    .section-title { font-size:1.4rem; font-weight:700; margin-bottom:20px; }
    .card { border:none; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.07); }
    .status-badge { font-size:11px; padding:3px 10px; border-radius:999px; font-weight:600; }
    .status-Confirmed { background:#d1fae5; color:#065f46; }
    .status-Pending   { background:#fef3c7; color:#92400e; }
    .status-Cancelled { background:#fee2e2; color:#991b1b; }
    .btn-book  { background:#1a6b3c; color:#fff; border:none; }
    .btn-book:hover { background:#145730; color:#fff; }
    #successAlert { display:none; }
    .appt-row { font-size:14px; }
    .delete-btn { cursor:pointer; color:#e24b4b; }
  </style>
</head>
<body>

<div class="top-header">
  <div>
    <h1><i class="fas fa-hospital-symbol me-2"></i>MedBook</h1>
    <p style="opacity:.8;font-size:13px;margin:0">Appointment Booking System</p>
  </div>
  <div style="text-align:right;font-size:13px;opacity:.8">Assignment 06 — Node.js + Express</div>
</div>

<div class="container-fluid py-4 px-4">
  <div class="row g-4">

    <!-- Booking Form -->
    <div class="col-lg-5">
      <div class="card p-4">
        <h2 class="section-title"><i class="fas fa-calendar-plus me-2 text-success"></i>Book Appointment</h2>
        <form id="bookingForm">
          <div class="mb-3"><input class="form-control" id="patientName" placeholder="Patient Name" required></div>
          <div class="mb-3"><input class="form-control" type="email" id="email" placeholder="Email Address" required></div>
          <div class="mb-3"><input class="form-control" id="phone" placeholder="Phone Number"></div>
          <div class="mb-3">
            <select class="form-select" id="doctorSelect" required>
              <option value="">— Select Doctor —</option>
            </select>
          </div>
          <div class="mb-3">
            <select class="form-select" id="timeSlot" required>
              <option value="">— Select Time Slot —</option>
            </select>
          </div>
          <div class="mb-3"><input class="form-control" type="date" id="apptDate" required></div>
          <div class="mb-3"><textarea class="form-control" id="reason" rows="3" placeholder="Reason for visit…"></textarea></div>
          <button class="btn btn-book w-100 rounded-pill py-2 fw-bold" type="submit">
            <i class="fas fa-check me-1"></i> Book Appointment
          </button>
        </form>
        <div id="successAlert" class="alert alert-success mt-3 rounded-3"></div>
      </div>
    </div>

    <!-- Appointments Table -->
    <div class="col-lg-7">
      <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="section-title mb-0"><i class="fas fa-list-alt me-2 text-success"></i>Appointments</h2>
          <button class="btn btn-outline-secondary btn-sm rounded-pill" onclick="loadAppointments()">
            <i class="fas fa-sync me-1"></i>Refresh
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="apptTable">
            <thead class="table-light"><tr>
              <th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th>
            </tr></thead>
            <tbody id="apptBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let doctors = [];

// Set min date to today
document.getElementById('apptDate').min = new Date().toISOString().split('T')[0];

// Load doctors
fetch('/api/doctors').then(r=>r.json()).then(data => {
  doctors = data;
  const sel = document.getElementById('doctorSelect');
  data.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.id; opt.textContent = `${d.name} — ${d.department}`;
    sel.appendChild(opt);
  });
});

// Doctor change → populate slots
document.getElementById('doctorSelect').addEventListener('change', function() {
  const doc = doctors.find(d => d.id == this.value);
  const slotSel = document.getElementById('timeSlot');
  slotSel.innerHTML = '<option value="">— Select Time Slot —</option>';
  if (doc) {
    doc.slots.forEach(s => {
      const o = document.createElement('option'); o.value = s; o.textContent = s;
      slotSel.appendChild(o);
    });
  }
});

// Load appointments
function loadAppointments() {
  fetch('/api/appointments').then(r=>r.json()).then(data => {
    document.getElementById('apptBody').innerHTML = data.map(a => `
      <tr class="appt-row">
        <td><strong>${a.patientName}</strong><br><small class="text-muted">${a.email}</small></td>
        <td>${a.doctor}<br><small class="text-muted">${a.department||''}</small></td>
        <td>${new Date(a.date).toLocaleDateString('en-IN')}</td>
        <td>${a.time}</td>
        <td><span class="status-badge status-${a.status}">${a.status}</span></td>
        <td><i class="fas fa-trash delete-btn" onclick="deleteAppt('${a.id}')" title="Cancel"></i></td>
      </tr>
    `).join('') || '<tr><td colspan="6" class="text-center text-muted">No appointments yet.</td></tr>';
  });
}

// Book appointment
document.getElementById('bookingForm').addEventListener('submit', async e => {
  e.preventDefault();
  const docId = document.getElementById('doctorSelect').value;
  const doc   = doctors.find(d => d.id == docId);
  const body  = {
    patientName: document.getElementById('patientName').value,
    email:       document.getElementById('email').value,
    phone:       document.getElementById('phone').value,
    doctor:      doc ? doc.name : '',
    department:  doc ? doc.department : '',
    date:        document.getElementById('apptDate').value,
    time:        document.getElementById('timeSlot').value,
    reason:      document.getElementById('reason').value,
  };
  const res = await fetch('/api/appointments', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const data = await res.json();
  const alert = document.getElementById('successAlert');
  if (res.ok) {
    alert.textContent = `✅ Appointment booked! ID: ${data.appointment.id.slice(0,8)}…`;
    alert.style.display = 'block';
    document.getElementById('bookingForm').reset();
    loadAppointments();
  } else {
    alert.textContent = data.error; alert.className = 'alert alert-danger mt-3 rounded-3';
    alert.style.display = 'block';
  }
});

// Delete
async function deleteAppt(id) {
  if (!confirm('Cancel this appointment?')) return;
  await fetch(`/api/appointments/${id}`, { method:'DELETE' });
  loadAppointments();
}

loadAppointments();
</script>
</body>
</html>
